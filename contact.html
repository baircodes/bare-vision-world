<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BARE VISION — Contact</title>

  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=5" />
  <script src="https://unpkg.com/lenis@1.0.45/dist/lenis.min.js"></script>
</head>
<body>
  <nav class="bv-nav">
    <a class="nav-brand" href="index.html">BARE VISION</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="stewardship.html">Project Stewardship</a>
      <a href="mirror.html">Private 1:1</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <main id="site">
    <section class="section" data-animate>
      <div class="panel">
        <h1 class="page-title">Contact</h1> 
        <p class="lead">Inquiries accepted by invitation. Please complete the form and we will respond via the email you provide.</p>

        <!-- Formspree example (replace FORM_ID) -->
        <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <label class="form-row">
            <span class="label">Name</span>
            <input type="text" name="name" required />
          </label>
          <label class="form-row">
            <span class="label">Email</span>
            <input type="email" name="_replyto" required />
          </label>
          <label class="form-row">
            <span class="label">Subject</span>
            <input type="text" name="subject" />
          </label>
          <label class="form-row">
            <span class="label">Message</span>
            <textarea name="message" rows="6" required></textarea>
          </label>

          <!-- Optional hidden honeypot -->
          <input type="text" name="_gotcha" style="display:none" />

          <div class="panel-cta">
            <button class="btn orb primary" type="submit">Send Inquiry</button>
          </div>
        </form>

        <hr class="hr-soft" />

        <div class="podcast-links">
          <p>Listen: <a href="https://yourpodcastsite.example" target="_blank" rel="noopener">Podcast Site</a></p>
          <p>Social: <a href="https://instagram.com/yourpodcast" target="_blank" rel="noopener">Podcast Instagram</a></p>
        </div>

      </div>
    </section>

    <footer class="footer" data-animate>
      <p>© BARE VISION ☺ a division of BAIR Atmospheres</p>
    </footer>
  </main>

  <script type="module" src="assets/js/main3d.js"></script>
</body>
</html>
