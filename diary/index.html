<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daph’s Digital Diary</title>

  <!-- Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">

  <style>
    :root {
      --off-black: #0f0f10;
      --bone: #f5f3ee;
      --chrome: #9fa3a7;
      --beige: #e6e0d6;
      --azur: #5f7f86;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Audiowide', sans-serif;
      background: var(--bone);
      color: var(--off-black);
      line-height: 1.5;
    }

    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 96px 24px 120px;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      margin-bottom: 48px;
      font-weight: 400;
    }

    .intro {
      max-width: 520px;
      margin-bottom: 96px;
      color: rgba(15,15,16,0.75);
      font-size: 0.85rem;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: var(--chrome);
      margin: 64px 0;
    }

    .entry-list {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .entry {
      text-decoration: none;
      color: inherit;
      transition: opacity 0.3s ease;
    }

    .entry:hover {
      opacity: 0.65;
    }

    .entry-title {
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .entry-meta {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: rgba(15,15,16,0.45);
    }

    footer {
      margin-top: 140px;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      color: rgba(15,15,16,0.4);
    }

    @media (max-width: 640px) {
      main {
        padding: 72px 20px 96px;
      }

      h1 {
        margin-bottom: 36px;
      }

      .intro {
        margin-bottom: 72px;
      }
    }
  </style>
</head>
<body>

  <main>

    <h1>Daph’s Digital Diary</h1>

    <p class="intro">
      Personal field notes. Observations, feelings written in real time.
      These entries are not statements — they are traces.
    </p>

    <div class="divider"></div>

    <section class="entry-list">

      <!-- Entry item -->
      <a href="entry-01.html" class="entry">
        <div class="entry-title">On Restraint</div>
        <div class="entry-meta">Field Entry</div>
      </a>

      <!-- Future entries appear here -->

    </section>

    <footer>
      Part of the BAIRatmospheres ecosystem
    </footer>

  </main>

</body>
</html>
